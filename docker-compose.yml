version: "1.0"

services:
  product-service:
    build: ./product-service
    ports:
      - "8080:8080"
    environment:
      - PORT=8080

  order-service:
    build: ./order-service
    ports:
      - "8081:8081"
    environment:
      - PORT=8081

  user-service:
    build: ./user-service
    ports:
      - "8082:8082"
    environment:
      - PORT=8082